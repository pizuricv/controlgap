[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "controlgap"
version = "0.1.0"
description = "The AI Drake Equation, as code: a hazard model and Control Gap Index for catastrophic AI risk."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Veselin Pizurica" }]
keywords = ["ai-safety", "risk", "hazard-model", "monte-carlo", "probabilistic-risk-assessment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=2.0", "scipy>=1.11"]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
app = ["streamlit>=1.40", "altair>=5"]
notebook = ["matplotlib>=3.8", "nbformat", "nbclient", "ipykernel"]
dev = ["pytest>=8", "matplotlib>=3.8", "streamlit>=1.40", "altair>=5"]

[tool.hatch.build.targets.wheel]
packages = ["src/controlgap"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
