# Colours live under [theme.light] and [theme.dark] so the app follows the viewer's light or dark setting.
# The three chart series colours are fixed in app/app.py: they are validated for colour-blind safety.
[theme]
baseFontSize = 16
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
headingFontSizes = ["1.75rem", "1.375rem", "1.125rem", "1rem", "0.9375rem", "0.875rem"]
headingFontWeights = [700, 600, 600, 600, 600, 600]
metricValueFontSize = "1.5rem"
metricValueFontWeight = 500
showSidebarBorder = true
showWidgetBorder = false
linkUnderline = true
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a"]

[theme.light]
primaryColor = "#1f66c1"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#1f2328"
linkColor = "#1f66c1"
borderColor = "#dddbd4"
dataframeBorderColor = "#e6e4de"

[theme.light.sidebar]
backgroundColor = "#f8f7f4"
secondaryBackgroundColor = "#ebe9e3"
borderColor = "#dddbd4"

[theme.dark]
primaryColor = "#6aa5ee"
backgroundColor = "#15171b"
secondaryBackgroundColor = "#22252b"
textColor = "#e7e5e0"
linkColor = "#8bb9f2"
borderColor = "#3a3d44"
dataframeBorderColor = "#30333a"

[theme.dark.sidebar]
backgroundColor = "#1b1d22"
secondaryBackgroundColor = "#2a2d34"
borderColor = "#3a3d44"

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
